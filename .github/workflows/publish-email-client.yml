# Publishes @adrianeyre/email-client to GitHub Packages from an
# `email-client-v<version>` tag, and from nothing else: there is no
# workflow_dispatch, so no branch can be published by hand (#177).
#
# Two jobs, so no dependency code ever runs beside a write token (#175), as in
# release.yml: `build` installs the dependencies, typechecks, tests, builds and
# packs the client with a read-only token that is not kept in git's config,
# and hands the tarball on as an artifact; `publish`, the only job that can
# write packages, installs nothing, runs no package script, checks that the
# tag's commit is on main and that the tarball is the package the tag names,
# and publishes that tarball. `publish` runs in the `email-client`
# environment, which the owner limits to `email-client-v*` tags
# (docs/operations/website-ci-and-releases.md#the-email-client).
#
# Every action is pinned by commit SHA (#176). Node and pnpm come from the
# pins in package.json.
name: Publish email client

on:
  push:
    tags:
      - "email-client-v*"

permissions:
  contents: read

# One publish at a time, never cancelled half-way through.
concurrency:
  group: publish-email-client
  cancel-in-progress: false

jobs:
  build:
    name: Build the email client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @adrianeyre/email-client typecheck

      - name: Test
        run: pnpm --filter @adrianeyre/email-client test

      - name: Build
        run: pnpm --filter @adrianeyre/email-client build

      - name: Pack
        working-directory: packages/email-client
        run: |
          mkdir -p "$RUNNER_TEMP/email-client"
          pnpm pack --pack-destination "$RUNNER_TEMP/email-client"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: email-client
          path: ${{ runner.temp }}/email-client/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the email client
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: email-client
    permissions:
      contents: read
      # Publishes to GitHub Packages; only this job has it.
      packages: write
    steps:
      # The whole history, so the tag's commit can be checked against main.
      # The token is not kept in git's config.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag's commit is on main
        run: |
          case "$GITHUB_REF" in
            refs/tags/email-client-v*) ;;
            *)
              echo "::error::Only an email-client-v* tag is published, not $GITHUB_REF"
              exit 1
              ;;
          esac
          commit="$(git rev-parse "$GITHUB_REF^{commit}")"
          if [ "$commit" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $GITHUB_REF_NAME has moved since this run started"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $commit, which is not on main"
            exit 1
          fi

      # Node only, to check and publish the tarball: nothing is installed.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          registry-url: https://npm.pkg.github.com
          scope: "@adrianeyre"

      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: email-client
          path: ${{ runner.temp }}/email-client

      # What `build` hands over is checked before it is used: one tarball,
      # holding only package.json, README.md and dist's JavaScript and types,
      # whose package.json names this package at the tag's version, with no
      # dependency and no install script. Unconditional: a run that is not an
      # email-client-v* tag fails here too.
      - name: Check the tag matches the package version
        run: |
          set -eu
          set -- "$RUNNER_TEMP"/email-client/*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::Expected one tarball from the build job, found $*"
            exit 1
          fi
          tarball="$1"
          unexpected="$(tar -tzf "$tarball" | grep -Ev '^package/(package\.json|README\.md|dist/[A-Za-z0-9_-]+\.(js|d\.ts))$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::The tarball holds files it shouldn't: $unexpected"
            exit 1
          fi
          tar -xzOf "$tarball" package/package.json > "$RUNNER_TEMP/email-client-package.json"
          node -e '
            const manifest = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const tagVersion = process.env.GITHUB_REF_NAME.replace(/^email-client-v/, "");
            const fail = (message) => { console.log(`::error::${message}`); process.exit(1); };
            if (!process.env.GITHUB_REF_NAME.startsWith("email-client-v")) fail(`${process.env.GITHUB_REF_NAME} is not an email-client-v* tag`);
            if (manifest.name !== "@adrianeyre/email-client") fail(`The tarball is ${manifest.name}, not @adrianeyre/email-client`);
            if (manifest.version !== tagVersion) fail(`Tag ${process.env.GITHUB_REF_NAME} does not match package.json version ${manifest.version}`);
            if (manifest.dependencies !== undefined) fail("The tarball has dependencies");
            for (const script of ["preinstall", "install", "postinstall", "prepare"]) {
              if (manifest.scripts?.[script] !== undefined) fail(`The tarball has a ${script} script`);
            }
          ' "$RUNNER_TEMP/email-client-package.json"
          echo "EMAIL_CLIENT_TARBALL=$tarball" >> "$GITHUB_ENV"

      # A tarball is published as it is, with no package script run.
      - name: Publish
        run: npm publish "$EMAIL_CLIENT_TARBALL" --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
