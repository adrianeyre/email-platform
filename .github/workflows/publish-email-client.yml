name: Publish email client

on:
  push:
    tags:
      - "email-client-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/email-client
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@adrianeyre"

      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/email-client-v')
        run: |
          tag_version="${GITHUB_REF_NAME#email-client-v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $package_version"
            exit 1
          fi

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Publish
        working-directory: .
        run: pnpm --filter @adrianeyre/email-client publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
