name: Pen-test finding
description: A confirmed weakness found in a pen-test round of the email platform, one issue per finding.
labels: ["prd:pen-test"]
body:
  - type: markdown
    attributes:
      value: |
        One finding per issue, found on the pen-test deployment or in the gated run, never on the production instance. Add exactly one `severity:*` label, judged against the remediation targets under **Findings workflow** in `docs/product-requirements-document/pen-testing.md`; triage confirms or changes it the same working day. How a finding is triaged, waived, fixed and verified is in `docs/pen-test/README.md`. Put no credential, cookie, API Key, token or real personal data in this issue: the fixtures are synthetic, so name them by handle or id.
  - type: input
    id: scope-issue
    attributes:
      label: Scope issue
      description: The scope issue this was found under, by number and ID.
      placeholder: "#92 (A1)"
    validations:
      required: true
  - type: input
    id: hypothesis
    attributes:
      label: H entry
      description: The opening-register entry in pen-testing.md this confirms, or "None" if the register did not anticipate it.
      placeholder: H1
    validations:
      required: true
  - type: textarea
    id: rule-broken
    attributes:
      label: Rule broken
      description: The guide section (docs/guide/…) and the ADR whose rule this breaks, linked.
      placeholder: |
        docs/guide/delivery-and-access.md, Users: …
        ADR 0008: the email platform is inside Wizzaroo's trust boundary …
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Numbered steps against the pen-test deployment, as a named fixture identity (victim, colleague, wizzaroo, secondApp, deleted), with each request and its body.
      placeholder: |
        1. Sign in as `victim` with `pnpm pen-test:sign-in victim`
        2. `POST /app/…` with …
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed
      description: What happened, with the status and the relevant part of each response.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should have happened under the rule above.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who can do this, to whose data, and which Applications or Users it crosses.
    validations:
      required: true
  - type: dropdown
    id: wizzaroo-links
    attributes:
      label: Wizzaroo's links exposed?
      description: Does this let anyone but its addressee reach a Wizzaroo reset, Invite or email-check link (H2)? A critical or high finding that does is also Wizzaroo's, and the owner decides the same day whether to expire its live links.
      options:
        - "No"
        - "Yes"
        - "Not known yet"
    validations:
      required: true
  - type: textarea
    id: catching-test
    attributes:
      label: Test that would have caught it
      description: The probe test in the gated run, by file and name, that pins this today and becomes its regression test with the fix.
      placeholder: "`src/pen-test/probes/a1.test.ts`: `today_…` beside the `it.fails` for the property that should hold"
    validations:
      required: true
