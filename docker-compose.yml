name: email-platform

x-app: &app
  build: .
  image: email-platform:local
  restart: unless-stopped
  environment:
    DATABASE_URL: postgres://email_platform:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/email_platform
    PORT: "4320"
    APP_URL: ${APP_URL:?set APP_URL in .env to the UI address, such as http://email.home:4320}
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env to 32 random bytes in base64}
  networks:
    - default
    - database

x-after-migrate: &after-migrate
  postgres:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: email_platform
      POSTGRES_DB: email_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - database
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "--username=email_platform",
          "--dbname=email_platform",
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  migrate:
    <<: *app
    restart: "no"
    command: ["dist/src/index.js", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["dist/src/index.js", "api"]
    ports:
      - "4320:4320"
    depends_on: *after-migrate
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4320/health').then((response) => process.exit(response.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  worker:
    <<: *app
    command: ["dist/src/index.js", "worker"]
    depends_on:
      <<: *after-migrate
      postfix:
        condition: service_healthy

  # The default SMTP provider: a Postfix mail server that delivers email
  # straight to recipients' mail servers (ADR 0008). A new install's Delivery
  # settings point at it (host `postfix`, port 587, no TLS, no username), so
  # nothing else needs setting up; set another provider in Delivery to use
  # that instead. Only the worker reaches it, on the Compose network; it is
  # never published.
  postfix:
    image: boky/postfix:5.2.1-alpine
    restart: unless-stopped
    environment:
      # Space-separated domains the app may send from, such as
      # "adrianeyre.co.uk wizzaroo.adrianeyre.co.uk". Postfix refuses others.
      ALLOWED_SENDER_DOMAINS: "${POSTFIX_SENDER_DOMAINS:-adrianeyre.co.uk wizzaroo.adrianeyre.co.uk}"
      # The name Postfix greets other mail servers with, such as
      # mail.adrianeyre.co.uk. It should resolve to the server's public IP;
      # left empty, it is the container's own name.
      POSTFIX_myhostname: ${POSTFIX_HOSTNAME:-}
      # Signs every email with DKIM, using a key made on first start for each
      # sender domain and kept in the postfix-dkim volume. Its DNS record is
      # in `docker compose exec postfix sh -c 'cat /var/lib/rspamd/dkim/*.txt'`.
      DKIM_AUTOGENERATE: "true"
      DKIM_SELECTOR: ${POSTFIX_DKIM_SELECTOR:-mail}
      # Optional: hand mail on to another server instead of delivering it
      # directly, such as [smtp-relay.brevo.com]:587.
      RELAYHOST: ${POSTFIX_RELAYHOST:-}
      RELAYHOST_USERNAME: ${POSTFIX_RELAYHOST_USERNAME:-}
      RELAYHOST_PASSWORD: ${POSTFIX_RELAYHOST_PASSWORD:-}
    volumes:
      - postfix-dkim:/var/lib/rspamd/dkim
      # Mail waiting to be delivered survives restarts.
      - postfix-spool:/var/spool/postfix
    networks:
      - default

  backup:
    build: ./backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: email_platform
      PGDATABASE: email_platform
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?set BACKUP_AGE_RECIPIENT in .env}
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:?set BACKUP_RCLONE_REMOTE in .env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-2}
      RCLONE_CONFIG: /run/secrets/rclone.conf
    volumes:
      - ${BACKUP_RCLONE_CONFIG_FILE:?set BACKUP_RCLONE_CONFIG_FILE in .env}:/run/secrets/rclone.conf:ro
    networks:
      - default
      - database
    depends_on:
      postgres:
        condition: service_healthy

  restore:
    build: ./backup
    profiles:
      - restore
    environment:
      PGHOST: postgres
      PGUSER: email_platform
      PGDATABASE: ${RESTORE_DATABASE:-email_platform}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:?set BACKUP_RCLONE_REMOTE in .env}
      BACKUP_AGE_IDENTITY_FILE: /run/secrets/backup-identity.txt
      RCLONE_CONFIG: /run/secrets/rclone.conf
    volumes:
      - ${BACKUP_RCLONE_CONFIG_FILE:?set BACKUP_RCLONE_CONFIG_FILE in .env}:/run/secrets/rclone.conf:ro
      - ${BACKUP_AGE_IDENTITY_FILE:-./backup-identity.txt}:/run/secrets/backup-identity.txt:ro
    networks:
      - default
      - database
    depends_on:
      postgres:
        condition: service_healthy

networks:
  database:
    internal: true

volumes:
  postgres-data:
  postfix-dkim:
  postfix-spool:
