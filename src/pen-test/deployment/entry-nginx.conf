# The pen-test deployment's entry proxy (docker-compose.pen-test.yml). It names exactly two upstreams and passes TCP
# straight through, adding no header. A file, not an inline Compose config, because Compose can't write an inline
# config into a read-only container (pen test I4, #182). It runs as nginx (101), so its pid goes to the /tmp tmpfs.
pid /tmp/nginx.pid;
error_log stderr;

events {}

stream {
  resolver 127.0.0.11 valid=10s;

  server {
    listen 43320;
    set $api api:4320;
    proxy_pass $api;
  }

  server {
    listen 43325;
    set $mailpit mailpit:8025;
    proxy_pass $mailpit;
  }
}
