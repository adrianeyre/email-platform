name: email-platform-dev

services:
  postgres:
    image: postgres:18-alpine@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
    environment:
      POSTGRES_USER: email_platform
      POSTGRES_DB: email_platform
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:54321:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
